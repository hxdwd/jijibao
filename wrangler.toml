# 基基宝 — Cloudflare Pages 项目配置
#
# 构建：npm run build（Vite 输出到 dist/）
# 部署：npm run deploy（或 npx wrangler pages deploy dist --project-name jijibao）
#
# 后端不在本项目 functions/ 里实现，而是转发给共享 Worker「my-bills-api」。
# 注意：本文件里的 bindings 会覆盖 Cloudflare Dashboard 中的同名配置。

name = "jijibao"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Service binding：同源调用、不过公网、不用 CORS。
# Worker 已关闭 workers.dev 公网入口（workers_dev = false），
# 因此这是唯一的调用通道，也是唯一的计费保护。
[[services]]
binding = "API"
service = "my-bills-api"
