# 基基宝 — Cloudflare Pages 项目配置
#
# 构建：在仓库根目录执行 npm run build（Vite 输出到 dist/）
# 部署：npx wrangler pages deploy dist --project-name jijibao
#
# 后端不在本项目的 functions/ 里实现，而是转发给共享 Worker「my-bills-api」：
#   - 推荐：Dashboard > 该项目 > Settings > Bindings > Service binding，变量名 API
#   - 兜底：设置环境变量 API_BASE_URL=<Worker 公网地址>

name = "jijibao"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 不在此处声明任何密钥。
# 前端需要的 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 在构建环境变量中配置。
